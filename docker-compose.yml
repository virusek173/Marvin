services:
  marvin:
    env_file:
      - ./.env
    build:
      context: ./
      dockerfile: ./Dockerfile
    restart: unless-stopped
    volumes:
      - marvin_data:/usr/src/app/data
      - ./people.json:/usr/src/app/data/people.json:ro

  marvin-staging:
    profiles: ["staging"]
    env_file:
      - ./.env.staging
    build:
      context: ./
      dockerfile: ./Dockerfile
    restart: unless-stopped
    volumes:
      - marvin_staging_data:/usr/src/app/data
      - ./people.json:/usr/src/app/data/people.json:ro

volumes:
  marvin_data:
  marvin_staging_data:
